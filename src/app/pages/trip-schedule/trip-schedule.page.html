<div class="space-y-6">
  <app-page-header
    title="Planning des trajets"
    subtitle="Planifiez et suivez tous vos départs"
    icon="calendar-clock"
  >
    <a routerLink="/ajout-trajet" class="btn btn-primary">
      <app-icon name="plus" [size]="16" /> Nouveau trajet
    </a>
  </app-page-header>

  @if (isLoading()) {
    <div class="flex items-center justify-center p-8">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600"></div>
      <span class="ml-3">Chargement des trajets...</span>
    </div>
  } @else {
    <div class="space-y-4">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
        <app-stat-card
          label="Total trajets"
          [value]="trips().length"
          icon="route"
          iconBg="bg-primary-50 text-primary-600"
        />
        <app-stat-card
          label="Planifiés"
          [value]="planifies()"
          icon="calendar"
          iconBg="bg-brand-50 text-brand-600"
        />
        <app-stat-card
          label="En cours"
          [value]="enCours()"
          icon="trending-up"
          iconBg="bg-amber-50 text-amber-600"
        />
      </div>

      <app-datatable
        [columns]="cols"
        [data]="trips()"
        [exportable]="true"
        [selectable]="true"
        [rowActions]="actions"
      />
    </div>

    @if (deletingTripId() && isDeleteModalOpen()) {
      <app-modal
        [isOpen]="isDeleteModalOpen()"
        (close)="cancelDelete()"
        title="Confirmer la suppression"
      >
        <div class="space-y-4">
          <p>Êtes-vous sûr de vouloir supprimer ce trajet ? Cette action est irréversible.</p>
          <div class="flex justify-end gap-3">
            <button class="btn btn-secondary" (click)="cancelDelete()">Annuler</button>
            <button class="btn btn-danger" (click)="confirmDelete()" [disabled]="isDeleting()">
              @if (isDeleting()) {
                <span class="animate-pulse">Suppression...</span>
              } @else {
                Supprimer
              }
            </button>
          </div>
        </div>
      </app-modal>
    }
  }
</div>
