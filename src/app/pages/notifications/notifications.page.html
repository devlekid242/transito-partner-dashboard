<div class="space-y-6">
  <app-page-header title="Notifications" subtitle="Restez informé de votre activité" icon="bell">
    <button
      class="btn btn-secondary"
      (click)="markAll()"
      [disabled]="isLoading() || isMarkingAll()"
    >
      @if (isMarkingAll()) {
        <span
          class="h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"
        ></span>
      } @else {
        <app-icon name="check-check" [size]="16" />
      }
      Tout marquer lu
    </button>
  </app-page-header>

  @if (isLoading()) {
    <div class="flex items-center justify-center p-8">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600"></div>
      <span class="ml-3">Chargement des notifications...</span>
    </div>
  } @else {
    <div class="card divide-y divide-ink-100">
      @for (n of api.notifications(); track n.id) {
        <div class="flex gap-4 p-4 transition-colors hover:bg-ink-50" [class.bg-brand-50]="!n.lu">
          <div
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full"
            [class]="bg(n.type)"
          >
            <app-icon [name]="icon(n.type)" [size]="18" />
          </div>
          <div class="flex-1">
            <div class="flex items-start justify-between gap-2">
              <div>
                <p class="text-sm font-semibold text-ink-900">
                  {{ n.titre }}
                </p>
                <p class="text-sm text-ink-500">{{ n.message }}</p>
              </div>
              @if (!n.lu) {
                <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-brand-500"></span>
              }
            </div>
            <p class="mt-1 text-xs text-ink-400">{{ time(n.date) }}</p>
          </div>
          <button class="text-ink-400 hover:text-ink-600" (click)="read(n)">
            <app-icon name="check" [size]="16" />
          </button>
        </div>
      }
    </div>
  }
</div>
